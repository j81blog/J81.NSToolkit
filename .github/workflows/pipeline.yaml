name: Test And Publish PowerShell Modules
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  pester-test:
    name: validation and push
    runs-on: windows-2022
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          clean: true
      - name: Install requirements
        shell: pwsh
        run: |
          .\ci\Install.ps1
      - name: Perform tests
        shell: pwsh
        run: |
          .\ci\Tests.ps1

  publish-modules:
    name: Publish modules
    runs-on: windows-2022
    needs: pester-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Publish to target gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY }}
          PSTESTGALLERY_API_KEY: ${{ secrets.PSGALLERYTEST }}
        run: |
          .\ci\Publish.ps1 -GitRef '${{ github.ref }}'
